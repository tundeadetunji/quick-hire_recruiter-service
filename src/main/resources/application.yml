server:
  port: ${PORT:8080}

spring:
  application:
    name: recruiter-service

  datasource:
    url: jdbc:h2:mem:quickrecruiter
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  sql:
    init:
      mode: always

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VHOST}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

storage:
  backend: h2

resilience4j:
  circuitbreaker:
    instances:
      recruiterNotify:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      recruiterNotify:
        maxAttempts: 3
        waitDuration: 500ms
  ratelimiter:
    instances:
      recruiterNotify:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 500ms

mq:
  queue: recruiter.notifications
  exchange: app.exchange
  routing-key: recruiter.notify

admin:
  queue: admin.notifications
  routing-key: admin.notify

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
